name: Deploy ProjectStatus staging

on:
  push:
    branches:
      - main
    paths:
      - deploy/environments/staging/project-status-image.txt
  workflow_dispatch:
    inputs:
      image:
        description: Immutable ghcr.io image@sha256:digest
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: newa-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on:
      - self-hosted
      - Linux
      - newa-staging
    environment: staging
    env:
      KUBECONFIG: /home/alexey/.kube/newa-staging-ci
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      SMOKE_COMPANY_NAME: ${{ secrets.SMOKE_COMPANY_NAME }}
      SMOKE_USER_NAME: ${{ secrets.SMOKE_USER_NAME }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Kubernetes context
        if: vars.KUBE_CONTEXT != ''
        run: kubectl config use-context "${{ vars.KUBE_CONTEXT }}"
      - id: release
        name: Resolve promoted image
        env:
          REQUESTED_IMAGE: ${{ inputs.image }}
        shell: bash
        run: |
          image="$REQUESTED_IMAGE"
          if [ -z "$image" ]; then
            image="$(tr -d '\r\n' < deploy/environments/staging/project-status-image.txt)"
          fi
          if [[ ! "$image" =~ ^[^[:space:]]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "ProjectStatus release must be an immutable image@sha256:digest" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Configure ProjectStatus registry credential
        env:
          REGISTRY_USERNAME: ${{ secrets.PROJECT_STATUS_GHCR_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.PROJECT_STATUS_GHCR_TOKEN }}
        run: |
          test -n "$REGISTRY_USERNAME"
          test -n "$REGISTRY_TOKEN"
          kubectl -n newa-staging create secret docker-registry project-status-registry-pull \
            --docker-server=ghcr.io \
            --docker-username="$REGISTRY_USERNAME" \
            --docker-password="$REGISTRY_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy immutable ProjectStatus image
        env:
          PROJECT_STATUS_IMAGE: ${{ steps.release.outputs.image }}
        run: bash scripts/deploy-project-status-staging.sh
      - name: Verify ProjectStatus
        run: |
          bash scripts/smoke-project-status-staging.sh
          bash scripts/assert-staging-rbac.sh
      - name: Record component last-known-good
        env:
          PROJECT_STATUS_IMAGE: ${{ steps.release.outputs.image }}
        run: bash scripts/record-project-status-release.sh
