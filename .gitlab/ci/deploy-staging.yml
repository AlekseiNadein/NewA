# Single job holds resource_group through apply → rollout → smoke → LKG.
# Do not create the namespace here: deploy SA is namespace-scoped.
.deploy_staging_rules: &deploy_staging_rules
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITLAB_CD_ENABLED == "true"'
  - if: '$CI_PIPELINE_SOURCE == "web" && $GITLAB_CD_ENABLED == "true"'

deploy:staging:
  stage: deploy
  image: alpine/k8s:1.33.1
  interruptible: false
  tags:
    - newa-staging
  needs:
    - job: publish:image
      artifacts: true
  resource_group: newa-staging
  environment:
    name: staging
    deployment_tier: staging
  rules: *deploy_staging_rules
  variables:
    # Self-hosted runner reaches cluster DNS (newa-staging.local) and kube API.
    KUBECONFIG: "/home/alexey/.kube/newa-staging-ci"
  before_script:
    - command -v bash
    - command -v curl
    - command -v jq
    - command -v kubectl
    - test -n "${IMAGE_REPOSITORY}"
    - test -n "${IMAGE_DIGEST}"
    - test -f "${KUBECONFIG}"
    - kubectl -n "${STAGING_NAMESPACE}" get deploy nav-api >/dev/null
  script:
    - |
      if [ -n "${STAGING_REGISTRY_USER:-}" ] && [ -n "${STAGING_REGISTRY_PASSWORD:-}" ]; then
        kubectl -n "${STAGING_NAMESPACE}" create secret docker-registry newa-registry-pull \
          --docker-server="${CI_REGISTRY}" \
          --docker-username="${STAGING_REGISTRY_USER}" \
          --docker-password="${STAGING_REGISTRY_PASSWORD}" \
          --dry-run=client -o yaml | kubectl apply -f -
      fi
    - bash scripts/deploy-staging.sh
    - kubectl -n "${STAGING_NAMESPACE}" rollout status deployment/nav-auth --timeout=300s
    - kubectl -n "${STAGING_NAMESPACE}" rollout status deployment/nav-calc-worker --timeout=300s
    - kubectl -n "${STAGING_NAMESPACE}" rollout status deployment/nav-api --timeout=300s
    - bash scripts/verify-staging.sh
    - bash scripts/smoke-staging-write.sh
    - bash scripts/assert-staging-rbac.sh
    - bash scripts/resolve-last-known-good.sh
  artifacts:
    when: always
    paths:
      - out/last-known-good.env
