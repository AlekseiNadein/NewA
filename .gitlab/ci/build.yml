build:affected:
  stage: build
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - apk add --no-cache git bash
    - sh scripts/detect-affected-components.sh
  artifacts:
    when: always
    paths:
      - out/affected-components.json
      - out/affected-components.env

publish:image:
  stage: publish
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs:
    - build:affected
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - mkdir -p out
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {"auths":{"$CI_REGISTRY":{"username":"$CI_REGISTRY_USER","password":"$CI_REGISTRY_PASSWORD"}}}
      EOF
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile" --destination "$CI_REGISTRY_IMAGE/nav-saas:$CI_COMMIT_SHA" --digest-file out/image-digest.txt
    - DIGEST="$(cat out/image-digest.txt)"
    - echo "IMAGE_REPOSITORY=$CI_REGISTRY_IMAGE/nav-saas" > out/publish.env
    - echo "IMAGE_TAG=$CI_COMMIT_SHA" >> out/publish.env
    - echo "IMAGE_DIGEST=$DIGEST" >> out/publish.env
  artifacts:
    when: always
    paths:
      - out/image-digest.txt
      - out/publish.env
    reports:
      dotenv: out/publish.env
