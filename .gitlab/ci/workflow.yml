# GitLab is the active CI/CD platform for staging after cutover.
# Project CI variable GITLAB_CD_ENABLED must stay "true" (overrides default).
workflow:
  auto_cancel:
    on_new_commit: conservative
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "api"'

stages:
  - validate
  - test
  - scan
  - build
  - publish
  - deploy
  - rollback

default:
  interruptible: true

variables:
  GO_VERSION: "1.25.0"
  STAGING_NAMESPACE: "newa-staging"
  # Default on; keep project variable GITLAB_CD_ENABLED=true as source of truth.
  GITLAB_CD_ENABLED: "true"
  FF_TIMESTAMPS: "true"
