# GitLab is the target CI/CD platform. Until cutover, keep GITLAB_CD_ENABLED
# unset/false so GitHub Actions remains the only active staging deployer.
workflow:
  auto_cancel:
    on_new_commit: conservative
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "api"'

stages:
  - validate
  - test
  - scan
  - build
  - publish
  - deploy
  - rollback

default:
  interruptible: true

variables:
  GO_VERSION: "1.25.0"
  STAGING_NAMESPACE: "newa-staging"
  # Flip to "true" only after GitHub staging CD is disabled.
  GITLAB_CD_ENABLED: "false"
  FF_TIMESTAMPS: "true"
