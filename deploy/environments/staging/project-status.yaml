apiVersion: v1
kind: Service
metadata:
  name: project-status
  namespace: newa-staging
  labels:
    app: project-status
spec:
  selector:
    app: project-status
  ports:
    - name: http
      port: 8100
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-status
  namespace: newa-staging
  labels:
    app: project-status
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: project-status
  template:
    metadata:
      labels:
        app: project-status
    spec:
      imagePullSecrets:
        - name: project-status-registry-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: project-status
          image: PROJECT_STATUS_IMAGE
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "8100"
            - name: APP_WEB_DIR
              value: /app/web
            - name: APP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: project-status-secrets
                  key: APP_DATABASE_URL
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: project-status-secrets
                  key: APP_JWT_SECRET
            - name: APP_NAV_RECALCULATION_URL
              value: http://nav-api:8090/api/estimates/{estimateId}/calc?force=1
          ports:
            - name: http
              containerPort: 8100
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: project-status
  namespace: newa-staging
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: newa-staging.local
      http:
        paths:
          - path: /projectStatusDesktop
            pathType: Prefix
            backend:
              service:
                name: project-status
                port:
                  name: http
          - path: /projectStatusMobile
            pathType: Prefix
            backend:
              service:
                name: project-status
                port:
                  name: http
          - path: /api/project-status/graphql
            pathType: Exact
            backend:
              service:
                name: project-status
                port:
                  name: http
