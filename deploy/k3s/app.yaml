apiVersion: v1
kind: Service
metadata:
  name: nav-api
spec:
  selector:
    app: nav-api
  ports:
    - name: http
      port: 8090
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: nav-auth
spec:
  selector:
    app: nav-auth
  ports:
    - name: http
      port: 8081
      targetPort: http
    - name: metrics
      port: 9091
      targetPort: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: nav-calc-worker
spec:
  selector:
    app: nav-calc-worker
  ports:
    - name: metrics
      port: 9092
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nav-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nav-api
  template:
    metadata:
      labels:
        app: nav-api
    spec:
      securityContext:
        fsGroup: 10001
      initContainers:
        - name: wait-dependencies
          image: postgres:17-bookworm
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              until pg_isready -h postgres -U nav -d nav; do sleep 2; done
              until (: >/dev/tcp/rabbitmq/5672) 2>/dev/null; do sleep 2; done
              until (: >/dev/tcp/redis/6379) 2>/dev/null; do sleep 2; done
      containers:
        - name: nav-api
          image: nav-saas:dev
          imagePullPolicy: Never
          command: ["/app/bin/nav-api"]
          envFrom:
            - configMapRef:
                name: nav-config
            - secretRef:
                name: nav-secrets
          env:
            - name: APP_ADDR
              value: ":8090"
            - name: APP_SERVICE_NAME
              value: nav-api
            - name: OTEL_SERVICE_NAME
              value: nav-api
            - name: APP_METRICS_ADDR
              value: ":9090"
          ports:
            - name: http
              containerPort: 8090
            - name: metrics
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: runtime
              mountPath: /app/runtime
      volumes:
        - name: runtime
          emptyDir: {}
---
