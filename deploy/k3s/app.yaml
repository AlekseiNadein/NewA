            - |
              until pg_isready -h postgres -U nav -d nav; do sleep 2; done
      containers:
        - name: nav-auth
          image: nav-saas:dev
          imagePullPolicy: Never
          command: ["/app/bin/nav-auth"]
          envFrom:
            - configMapRef:
                name: nav-config
            - secretRef:
                name: nav-secrets
          env:
            - name: APP_AUTH_ADDR
              value: ":8081"
            - name: APP_SERVICE_NAME
              value: nav-auth
            - name: OTEL_SERVICE_NAME
              value: nav-auth
