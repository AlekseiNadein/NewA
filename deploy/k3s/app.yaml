---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nav-config
data:
  APP_WEB_DIR: /app/web
  APP_DATA_PATH: /app/runtime/app.json
  APP_QUEUE_MODE: rabbit
  APP_RABBITMQ_EXCHANGE: estimate.calc
  APP_RABBITMQ_PREFETCH: "4"
  APP_OUTBOX_PUBLISH_BATCH: "100"
  APP_OUTBOX_PUBLISH_INTERVAL: 1s
  APP_GSN_REDIS_CACHE: "1"
  APP_REDIS_URL: redis://redis:6379/0
  APP_GSN_CACHE_TTL: 6h
  APP_LOG_LEVEL: info
  APP_LOG_FORMAT: json
  APP_AUTH_METRICS_URL: http://nav-auth:9091/metrics
  APP_WORKER_METRICS_URL: http://nav-calc-worker:9092/metrics
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_TRACES_SAMPLER_ARG: "1"
  APP_GRAFANA_URL: /grafana/
  APP_PROMETHEUS_URL: /prometheus/
  APP_K6_GRAFANA_URL: /grafana/d/nav-k6-load/k6-load-test
  APP_LOKI_URL: /grafana/explore
  APP_TEMPO_URL: /grafana/explore
