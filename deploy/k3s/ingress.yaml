apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nav
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: nav.local
      http:
        paths:
          - path: /api/auth/login
            pathType: Exact
            backend:
              service:
                name: nav-auth
                port:
                  name: http
          - path: /api/auth/logout
            pathType: Exact
            backend:
              service:
                name: nav-auth
                port:
                  name: http
          - path: /api/auth/register
            pathType: Exact
            backend:
              service:
                name: nav-auth
                port:
                  name: http
          - path: /api/me
            pathType: Prefix
            backend:
              service:
                name: nav-auth
                port:
                  name: http
          - path: /api/companies
            pathType: Exact
            backend:
              service:
                name: nav-auth
                port:
                  name: http
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: nav-auth
                port:
                  name: http
          - path: /api/admin/licenses
            pathType: Exact
            backend:
              service:
                name: nav-auth
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nav-api
                port:
                  name: http
