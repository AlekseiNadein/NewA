apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 999
      initContainers:
        - name: prepare-schema
          image: nav-saas:dev
          imagePullPolicy: Never
          command:
            - /bin/sh
            - -ec
            - |
              cp /app/db/gsn_schema.sql /initdb/10-gsn-schema.sql
              cp /app/db/gsn_migrate_supplements.sql /initdb/20-gsn-supplements.sql
              cp /app/db/migrate_gsn_logistics_determinant_12.sql /initdb/30-gsn-logistics.sql
          volumeMounts:
            - name: init
              mountPath: /initdb
      containers:
        - name: postgres
          image: postgres:17-bookworm
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: nav
            - name: POSTGRES_USER
              value: nav
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nav-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "nav", "-d", "nav"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "nav", "-d", "nav"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          emptyDir: {}
