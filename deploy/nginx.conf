worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream nav_app {
        server 127.0.0.1:8090;
    }

    upstream nav_auth {
        server 127.0.0.1:8081;
    }

    upstream project_status {
        server 127.0.0.1:8100;
    }

    server {
        listen 8080;
        server_name localhost;

        client_max_body_size 32m;

        location = /api/auth/login {
            proxy_pass http://nav_auth;
            include proxy_params.conf;
        }
        location = /api/auth/logout {
            proxy_pass http://nav_auth;
            include proxy_params.conf;
        }
        location = /api/auth/register {
            proxy_pass http://nav_auth;
            include proxy_params.conf;
        }
        location = /api/me {
            proxy_pass http://nav_auth;
            include proxy_params.conf;
        }
        location = /api/companies {
            proxy_pass http://nav_auth;
            include proxy_params.conf;
        }
        location /api/users {
            proxy_pass http://nav_auth;
            include proxy_params.conf;
        }
        location = /api/admin/licenses {
            proxy_pass http://nav_auth;
            include proxy_params.conf;
        }

        location = /login {
            proxy_pass http://nav_app/login.html;
            include proxy_params.conf;
        }
        location = /login.html {
            proxy_pass http://nav_app;
            include proxy_params.conf;
        }

        location = /projectStatusDesktop {
            return 308 /projectStatusDesktop/;
        }
        location ^~ /projectStatusDesktop/ {
            proxy_pass http://project_status;
            include proxy_params.conf;
        }
        location = /projectStatusMobile {
            return 308 /projectStatusMobile/;
        }
        location ^~ /projectStatusMobile/ {
            proxy_pass http://project_status;
            include proxy_params.conf;
        }
        location = /api/project-status/graphql {
            proxy_pass http://project_status/api/graphql;
            include proxy_params.conf;
        }

        location / {
            proxy_pass http://nav_app;
            include proxy_params.conf;
        }
    }
}
