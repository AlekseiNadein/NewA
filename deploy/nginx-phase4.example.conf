# NAV — пример nginx для фазы 4 (пока не подключён)

Фаза 4 заменит встроенный reverse proxy (`APP_AUTH_SERVICE_URL` в Go) на nginx перед app и auth.

```nginx
upstream nav_app {
    server 127.0.0.1:8080;
}

upstream nav_auth {
    server 127.0.0.1:8081;
}

server {
    listen 80;
    server_name localhost;

    # Статика и бизнес-API
    location / {
        proxy_pass http://nav_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth API — напрямую на auth-сервис
    location = /api/auth/login { proxy_pass http://nav_auth; include proxy_params.conf; }
    location = /api/auth/logout { proxy_pass http://nav_auth; include proxy_params.conf; }
    location = /api/auth/register { proxy_pass http://nav_auth; include proxy_params.conf; }
    location = /api/me { proxy_pass http://nav_auth; include proxy_params.conf; }
    location = /api/companies { proxy_pass http://nav_auth; include proxy_params.conf; }
    location /api/users { proxy_pass http://nav_auth; include proxy_params.conf; }
    location = /api/admin/licenses { proxy_pass http://nav_auth; include proxy_params.conf; }
}
```

После фазы 4:
- убрать `APP_AUTH_SERVICE_URL` и `internal/api/proxy.go` из app-сервера;
- nginx становится единой точкой входа;
- `APP_JWT_SECRET` по-прежнему общий для app и auth.
